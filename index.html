<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افزودن کانفیگ</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#0f1115;color:#eee;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px;box-sizing:border-box;}
  .box{max-width:420px;width:100%;text-align:center;background:#1b1e27;padding:28px 20px;border-radius:16px;}
  h2{margin:0 0 10px;font-size:18px;}
  p{color:#aaa;font-size:14px;line-height:1.8;}
  .btn{display:block;margin:14px auto 0;padding:12px 18px;border-radius:10px;background:#3b82f6;color:#fff;
       text-decoration:none;font-size:15px;border:none;width:100%;box-sizing:border-box;cursor:pointer;}
  .code{word-break:break-all;background:#11141a;padding:12px;border-radius:10px;font-size:12px;
        color:#9ad;margin-top:16px;user-select:all;text-align:left;direction:ltr;}
  .err{color:#f87171;}
  .ok{color:#4ade80;}
</style>
</head>
<body>
  <div class="box">
    <h2 id="title">⏳ در حال باز کردن اپ...</h2>
    <p id="msg">اگه اپ به‌صورت خودکار باز نشد، از دکمه یا کدِ زیر استفاده کنید.</p>
    <a id="openBtn" class="btn" href="#" style="display:none">📲 باز کردن دوباره در اپ</a>
    <div id="codeBox" class="code" style="display:none"></div>
  </div>

<script>
// ─────────────────────────────────────────────────────────────
// آدرسِ Cloudflare Worker که فایل raw-worker.js رویش دیپلوی شده.
// v2rayNG و V2Box برخلاف Hiddify، کانفیگ رو مستقیم قبول نمی‌کنن؛
// اونا خودشون یک درخواست HTTP به "url" می‌زنن و متنِ کانفیگ رو از
// جوابش می‌خونن. برای همین به یک آدرسِ واقعاً قابل‌فچ نیاز دارن،
// نه خودِ رشته‌ی vless://... . این آدرس رو دقیقاً همینه.
const WORKER_RAW_BASE = "https://raw-config.nova-20b1b3.workers.dev"; // <-- اینو با آدرس ورکر خودتون عوض کنید

function b64urlDecode(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const binary = atob(s);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

(function () {
  const params = new URLSearchParams(window.location.search);
  const app = params.get('a');
  const name = params.get('n') ? decodeURIComponent(params.get('n')) : '';
  const c = params.get('c');

  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const openBtn = document.getElementById('openBtn');
  const codeBox = document.getElementById('codeBox');

  if (!app || !c) {
    titleEl.textContent = '❌ لینک نامعتبر است';
    titleEl.classList.add('err');
    msgEl.textContent = 'پارامترهای لازم (a و c) در لینک وجود ندارد.';
    return;
  }

  let config;
  try {
    config = b64urlDecode(c);
  } catch (e) {
    titleEl.textContent = '❌ خطا در خواندن کانفیگ';
    titleEl.classList.add('err');
    msgEl.textContent = 'دیکد کردن کانفیگ ناموفق بود: ' + e.message;
    return;
  }

  // آدرسِ قابل‌فچ که v2rayNG/V2Box باید بهش سر بزنند تا متنِ کانفیگ را بگیرند
  const fetchableUrl = WORKER_RAW_BASE + '/raw?c=' + encodeURIComponent(c);

  let deepLink = null;

  if (app === 'hiddify') {
    // Hiddify طبق مستندات رسمی‌اش، خودِ لینکِ کانفیگ رو (بدون encode) بعد از import/ می‌خواد
    deepLink = 'hiddify://import/' + config;
  } else if (app === 'v2rayng') {
    // v2rayNG پارامتر url رو خودش فچ می‌کنه؛ باید یک آدرسِ http(s) واقعی باشه
    deepLink = 'v2rayng://install-config?url=' + encodeURIComponent(fetchableUrl)
             + '&name=' + encodeURIComponent(name);
  } else if (app === 'v2box') {
    // نکته‌ی مهم: اکشنِ درستِ V2Box «install-sub» است نه «install-config»،
    // و اون هم دقیقاً مثل v2rayNG یک آدرسِ http(s) قابل‌فچ می‌خواد
    deepLink = 'v2box://install-sub?url=' + encodeURIComponent(fetchableUrl)
             + '&name=' + encodeURIComponent(name);
  } else if (app === 'shadowrocket') {
    // Shadowrocket برای یک کانفیگِ تکی دیپ‌لینکِ رسمی/مستندی نداره؛
    // مطمئن‌ترین راه: کانفیگ رو کپی می‌کنیم و خودِ اپ رو باز می‌کنیم،
    // شما فقط کافیه داخل اپ روی «+» بزنید (اپ خودش کلیپ‌بورد رو تشخیص می‌ده)
    titleEl.textContent = '📋 کانفیگ کپی شد';
    msgEl.textContent = 'حالا Shadowrocket باز می‌شود؛ داخل اپ روی «+» بزنید تا خودکار از کلیپ‌بورد اضافه شود.';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(config).catch(() => {});
    }
    openBtn.href = 'shadowrocket://';
    openBtn.style.display = 'block';
    window.location.href = 'shadowrocket://';
    return;
  } else {
    titleEl.textContent = '❌ اپ ناشناخته';
    titleEl.classList.add('err');
    msgEl.textContent = 'برای این اپ فرمت لینک تعریف نشده.';
    return;
  }

  titleEl.textContent = '📲 در حال باز کردن ' + (name || 'کانفیگ');
  openBtn.href = deepLink;
  openBtn.style.display = 'block';

  // فقط برای عیب‌یابی: خودِ لینکِ نهایی که به اپ فرستاده میشه رو نشون بده
  codeBox.style.display = 'block';
  codeBox.textContent = deepLink;

  window.location.href = deepLink;
})();
</script>
</body>
</html>
