<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افزودن کانفیگ</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#0f1115;color:#eee;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px;box-sizing:border-box;}
  .box{max-width:420px;width:100%;text-align:center;background:#1b1e27;padding:28px 20px;border-radius:16px;}
  h2{margin:0 0 10px;font-size:18px;}
  p{color:#aaa;font-size:14px;line-height:1.8;}
  .btn{display:block;margin:14px auto 0;padding:12px 18px;border-radius:10px;background:#3b82f6;color:#fff;
       text-decoration:none;font-size:15px;}
  .code{word-break:break-all;background:#11141a;padding:12px;border-radius:10px;font-size:12px;
        color:#9ad;margin-top:16px;user-select:all;text-align:left;direction:ltr;}
  .err{color:#f87171;}
</style>
</head>
<body>
  <div class="box">
    <h2 id="title">⏳ در حال باز کردن اپ...</h2>
    <p id="msg">اگه اپ به‌صورت خودکار باز نشد، از دکمه یا کدِ زیر استفاده کنید.</p>
    <a id="openBtn" class="btn" href="#" style="display:none">📲 باز کردن دوباره در اپ</a>
    <div id="codeBox" class="code" style="display:none"></div>
  </div>

<script>
// base64url (که پایتون با urlsafe_b64encode می‌سازد) -> رشته‌ی اصلی کانفیگ
function b64urlDecode(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const binary = atob(s);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function buildDeepLink(app, config) {
  const encoded = encodeURIComponent(config);
  switch (app) {
    case 'v2box':        return 'v2box://install-config?url=' + encoded;
    case 'v2rayng':       return 'v2rayng://install-config?url=' + encoded;
    case 'shadowrocket':  return 'shadowrocket://add/' + encoded;
    case 'hiddify':        return 'hiddify://import/' + config; // بدون encode مجدد
    default: return null;
  }
}

(function () {
  const params = new URLSearchParams(window.location.search);
  const app = params.get('a');
  const name = params.get('n') ? decodeURIComponent(params.get('n')) : '';
  const c = params.get('c');

  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const openBtn = document.getElementById('openBtn');
  const codeBox = document.getElementById('codeBox');

  if (!app || !c) {
    titleEl.textContent = '❌ لینک نامعتبر است';
    titleEl.classList.add('err');
    msgEl.textContent = 'پارامترهای لازم (a و c) در لینک وجود ندارد.';
    return;
  }

  let config;
  try {
    config = b64urlDecode(c);
  } catch (e) {
    titleEl.textContent = '❌ خطا در خواندن کانفیگ';
    titleEl.classList.add('err');
    msgEl.textContent = 'دیکد کردن کانفیگ ناموفق بود: ' + e.message;
    return;
  }

  const deepLink = buildDeepLink(app, config);
  if (!deepLink) {
    titleEl.textContent = '❌ اپ ناشناخته';
    titleEl.classList.add('err');
    msgEl.textContent = 'برای این اپ فرمت لینک تعریف نشده.';
    codeBox.style.display = 'block';
    codeBox.textContent = config;
    return;
  }

  titleEl.textContent = '📲 در حال باز کردن ' + (name || 'کانفیگ');
  openBtn.href = deepLink;
  openBtn.style.display = 'block';
  codeBox.style.display = 'block';
  codeBox.textContent = config;

  // تلاش خودکار برای باز کردن اپ
  window.location.href = deepLink;
})();
</script>
</body>
</html>
